# GitHub sometimes accepts a scheduled run and then fails it before any job
# starts (conclusion: startup_failure). The sync workflow never gets a chance
# to retry itself. This watcher re-runs that same run, up to three attempts.

name: Retry NFL stats sync

on:
  workflow_run:
    workflows: ["Sync NFL stats"]
    types: [completed]
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-sync-nfl-stats
  cancel-in-progress: false

jobs:
  retry:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'startup_failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run a recent startup failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '36 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          runs=$(gh run list \
            --workflow sync-nfl-stats.yml \
            --limit 20 \
            --json databaseId,conclusion,status,createdAt,attempt,url)

          target=$(echo "$runs" | jq -c --arg cutoff "$cutoff" '
            [ .[]
              | select(
                  .conclusion == "startup_failure"
                  and .status == "completed"
                  and .createdAt >= $cutoff
                  and (.attempt // 1) < 3
                )
            ]
            | sort_by(.createdAt)
            | last // empty
          ')

          if [ -z "$target" ]; then
            echo "No recent startup failure to retry."
            exit 0
          fi

          created=$(echo "$target" | jq -r '.createdAt')
          later=$(echo "$runs" | jq -r --arg created "$created" '
            [ .[] | select(.conclusion == "success" and .createdAt > $created) ] | length
          ')
          if [ "$later" != "0" ]; then
            echo "A later sync already succeeded. Leaving the startup failure alone."
            exit 0
          fi

          id=$(echo "$target" | jq -r '.databaseId')
          attempt=$(echo "$target" | jq -r '.attempt')
          url=$(echo "$target" | jq -r '.url')
          echo "Re-running $url (attempt $attempt)."
          gh run rerun "$id"
